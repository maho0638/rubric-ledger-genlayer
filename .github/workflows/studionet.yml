name: rubric-ledger-genlayer Studionet Proof (manual)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/studionet.yml'  # one-shot network verification only when workflow changed
jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sha256sum contracts/rubric_ledger.py
      - run: gltest tests/integration/test_studionet.py -v -s --network studionet
